<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="Team 54">
	<title>Buffer Overflow Visualization</title>
	<script src="app.js" defer></script>
	<style>
		body {
			background-color: #131313;
			color: white;
			text-align: center;
		}
		.visual {
			font-family: monospace, monospace;
		}
		.canary {
			color: yellow;
		}
	</style>
</head>
<body>
	<div class="VisualContainer">
		<div id="MemoryVisual" class="visual" style="font-size: 1.375em;">
			...
			<span id="StringBuffer" title="String buffer for user input"></span>
			<span id="MemoryPadding" title="Memory Padding"></span>
			<span id="StackBasePointer" title="Stack Base Pointer"></span>
			<span id="InstructionPointer" title="Instruction Pointer"></span>
			...
			<span id="MalwareMemory" title="Malware" style="color: red;"></span>
		</div>
		<code id="Message" style="color: red; font-size: 1.25em;"></code>
		<div id="Legend"></div>
		<label for="StringInputSize">Size: </label>
		<span id="StringInputSize"></span>
	</div>
	<div class="Input Container">
		<label for="StringInput">Input String</label>
		<input type="text" id="StringInput">
		<div class="options" id="VisualOptions">
			<label for="MalwareCheckbox">Malware</label>
			<input type="checkbox" id="MalwareCheckbox"></input>
			<label for="CanaryCheckbox">Canary</label>
			<input type="checkbox" id="CanaryCheckbox"></input>
		</div>
	</div>
</body>
</html>
